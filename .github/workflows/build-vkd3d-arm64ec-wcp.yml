# Build vkd3d-proton as ARM64EC and package it as a GameNative VKD3D .wcp.
#
# GameNative's stock VKD3D packages are x86-64, so every D3D12 call made by the
# game also runs through FEX. An ARM64EC d3d12.dll/d3d12core.dll runs natively
# and leaves FEX only the game itself. syswow64 gets an i686 build from the same
# source so 32-bit D3D12 apps keep working.
#
# vkd3d-proton ships no ARM64EC cross file, so both are written here. Uses the
# same bylaws llvm-mingw as build-fexcore-wcp.yml.
#
# vkd3d-patches/*.patch from this repo go on top of the tag, in name order
# (build 55: clear folding, GPU pass meter, present timeline; FEX's switches
# turn them on, see Source/Windows/Common/EnvironmentVariablesHandling.h).
name: Build VKD3D ARM64EC WCP

on:
  push:
    branches: [ d2r/clean ]
    paths: [ .github/workflows/build-vkd3d-arm64ec-wcp.yml, vkd3d-patches/** ]
  workflow_dispatch:

env:
  LLVM_MINGW: llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
  VKD3D_TAG: v3.0b
  WCP_VERSION: 3.0b-arm64ec-fex15
  WCP_VERSION_CODE: 16

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout vkd3d-proton
        uses: actions/checkout@v4
        with:
          repository: HansKristian-Work/vkd3d-proton
          ref: ${{ env.VKD3D_TAG }}
          submodules: recursive

      - name: Checkout FEX patches
        uses: actions/checkout@v4
        with:
          path: fex-src
          sparse-checkout: vkd3d-patches

      - name: Apply FEX patches
        run: |
          for p in fex-src/vkd3d-patches/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          git diff --stat

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip glslang-tools zstd
          pip install --user meson

      - name: Cache LLVM MinGW toolchain
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: bylaws-${{ env.LLVM_MINGW }}

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/bylaws/llvm-mingw/releases/download/20250920/${LLVM_MINGW}.tar.xz
          mkdir -p ~/llvm-mingw
          tar -xf ${LLVM_MINGW}.tar.xz -C ~/llvm-mingw --strip-components=1

      - name: Write cross files
        run: |
          write_cross() {
            cat > "$1" <<EOF
          [binaries]
          c = '$2-w64-mingw32-clang'
          cpp = '$2-w64-mingw32-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          widl-mingw-tools-fallback = '$2-w64-mingw32-widl'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'windows'
          cpu_family = '$3'
          cpu = '$4'
          endian = 'little'
          EOF
          }
          write_cross build-arm64ec.txt arm64ec aarch64 arm64ec
          write_cross build-i686.txt i686 x86 i686
          cat build-arm64ec.txt

      - name: Build
        run: |
          export PATH="$HOME/llvm-mingw/bin:$HOME/.local/bin:$PATH"
          for arch in arm64ec i686; do
            meson setup --cross-file build-$arch.txt --buildtype release --strip \
              -Denable_tests=false build.$arch
            ninja -C build.$arch
          done

      - name: Verify ARM64EC
        run: |
          for f in build.arm64ec/libs/d3d12/d3d12.dll build.arm64ec/libs/d3d12core/d3d12core.dll; do
            llvm-readobj --coff-load-config "$f" | grep -q CHPEMetadata || { echo "$f is not ARM64EC"; exit 1; }
          done
        env:
          PATH: /home/runner/llvm-mingw/bin:/usr/bin:/bin

      - name: Package .wcp
        run: |
          mkdir -p pkg/system32 pkg/syswow64
          cp build.arm64ec/libs/d3d12/d3d12.dll build.arm64ec/libs/d3d12core/d3d12core.dll pkg/system32/
          cp build.i686/libs/d3d12/d3d12.dll build.i686/libs/d3d12core/d3d12core.dll pkg/syswow64/
          cat > pkg/profile.json <<EOF
          {
            "type": "VKD3D",
            "versionName": "${WCP_VERSION}",
            "versionCode": ${WCP_VERSION_CODE},
            "description": "vkd3d-proton ${VKD3D_TAG} built as ARM64EC (system32, runs without FEX) and i686 (syswow64), with FEX-D2-reforged's vkd3d-patches (clear folding, GPU pass meter, present timeline, cap pre-sleep, gradual frame start pacing whose margin only grows for frames the hold-back made late, read-only depth-stencil planes not written back after a render pass, frame start pacing that counts a busy GPU as spare time, pass shape measurements, frame done signalled from the CPU after the swapchain copy's fence instead of an empty queue submit, that fence watched from the copy's submit so pacing sees the real GPU finish, a 30 ms hold-back ceiling (50 ms from fex14), spare times of the last 256 frames instead of 64 outside GPU-bound pacing (fex15), the cap's grid measured from every held present, a frame start margin that recovers 1 ms per 60 frames, per-draw GPU timing with the driver's shader statistics, GPU-bound frame start pacing, GPU timers in 1 frame in 8, zero fills of never-used memory skipped, a gpu report of new memory, vkd3d's transfers and the GPU time between render passes, frames to the window system only once drawn, a copy of chosen shaders and the driver's compiled code for FEX's stats log). Build from ${GITHUB_SHA}.",
            "files": [
              {"source": "system32/d3d12.dll",     "target": "\${system32}/d3d12.dll"},
              {"source": "system32/d3d12core.dll", "target": "\${system32}/d3d12core.dll"},
              {"source": "syswow64/d3d12.dll",     "target": "\${syswow64}/d3d12.dll"},
              {"source": "syswow64/d3d12core.dll", "target": "\${syswow64}/d3d12core.dll"}
            ]
          }
          EOF
          python3 -m json.tool pkg/profile.json
          cd pkg
          tar -I 'zstd -T0 -19' -cf "../vkd3d-proton-${WCP_VERSION}.wcp" profile.json system32 syswow64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vkd3d-wcp
          path: vkd3d-proton-${{ env.WCP_VERSION }}.wcp
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vkd3d-proton-${{ env.WCP_VERSION }}-${{ github.run_number }}
          name: VKD3D-Proton ${{ env.WCP_VERSION }} (build ${{ github.run_number }})
          files: vkd3d-proton-${{ env.WCP_VERSION }}.wcp
          prerelease: true
          body: |
            vkd3d-proton ${{ env.VKD3D_TAG }} compiled as ARM64EC, so D3D12 translation runs
            natively instead of through FEX, with this repo's vkd3d-patches: full clears folded
            into the next render pass, a GPU pass meter and a present timeline for FEX's stats log,
            a frame cap's wait slept out without holding the VkQueue, and frame start pacing
            (all off unless FEX's switches set their variables). Read-only depth-stencil planes
            are no longer written back to memory after each render pass (on unless
            VKD3D_FEX_DS_STORE_NONE=0). From fex6 on, frame start pacing also counts the time a
            frame waits for a busy GPU as spare time (lower input lag in GPU-bound scenes), and the
            pass meter measures the shape of the costliest passes. From fex7 on, each frame's done
            signal comes from the CPU after the swapchain copy's fence instead of an empty queue
            submit that held the shared VkQueue until the GPU caught up (on unless
            VKD3D_FEX_HOST_FRAME_DONE=0), and frame start pacing sees the GPU finish of every frame.
            From fex8 on, that fence is watched from the copy's submit, so a GPU finish before the
            frame cap's release is seen when it happens; the hold-back may reach 30 ms (was 20);
            and the cap pre-sleep measures the cap's grid from every held present instead of
            letting two presents a few seconds hold the VkQueue for a whole frame.
            From fex9 on, the frame start margin shrinks by 1 ms per 60 frames without a late one
            (was 150), and the pass meter times every draw of one costly pass a second and reports
            the costliest pipelines with the driver's shader statistics.
            From fex10 on, frame start pacing has a GPU-bound mode (48 of the last 64 frames waited
            for a busy GPU): the hold-back aims at the 7th smallest spare time instead of the
            smallest, and a late frame takes off what it came late by instead of halving it. The
            pass meter's GPU timers go into 1 frame in 8 (VKD3D_FEX_PASSES=2: every frame), and the
            per-draw timing is off unless VKD3D_FEX_DRAWS=1.
            From fex11 on, new memory placed in pages of vkd3d's memory blocks that were never used
            since the driver zeroed the block skips its zero fill on the GPU (on with
            VKD3D_FEX_SKIP_FRESH_CLEARS=1, Turnip only), and a new gpu report counts new memory's
            zero fills, times vkd3d's own transfer submissions and the GPU time between render
            passes by what the game recorded there. Pass timer results are reset once read, so a
            reused timer can't show an earlier frame's values.
            From fex12 on, a frame goes to the window system only once the GPU has drawn it (on with
            VKD3D_FEX_PRESENT_DRAWN=1): GameNative's X server shows an image as soon as the present
            reaches it, without waiting for the GPU, so a frame handed over earlier showed an older
            frame. A 'screen handoff' line counts the frames the GPU wasn't done with and the wait.
            From fex13 on, VKD3D_FEX_SHADER_COPY (pixel shader hashes) copies those shaders' D3D
            bytecode, PSO and root signature, and for the first four the SPIR-V and the driver's
            compiled code, into a table FEX's stats log writes out. Rendering is unchanged.
            From fex14 on, frame start pacing may hold the game's next frame back up to 50 ms (was
            30; VKD3D_FEX_START_MAX_MS sets 1-90 ms): with FEX's faster game frames the spare time
            allowed ~58 ms while the 30 ms ceiling left frames ~70 ms from start to screen.
            From fex15 on, outside GPU-bound pacing the hold-back stays below the smallest spare time
            of the last 256 frames (~8.5 s) instead of the last 64 (~2 s; VKD3D_FEX_START_WINDOW sets
            64-1024): the game's occasional slow frames came ~6 s apart, so 2 s after one the
            hold-back had grown back into the next and made it late.
            Install in GameNative as a VKD3D
            content profile; it appears as `${{ env.WCP_VERSION }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
