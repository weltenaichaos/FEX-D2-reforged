# Build our own Proton 11.0-1 (ARM64EC, bionic) and package it as a GameNative Proton .wcp.
#
# Source: GameNative/proton-wine, branch proton_11.0, pinned to the commit GameNative's
# stock "Proton 11.0-1 ARM64ec" (proton-11.0-1-arm64ec-1, release build-p11-20260502-1-sdk28)
# was built from (plus their workflow-only commit f7c0166). Built the same way as their
# build-proton-sdk28.yml (aarch64 job only: NDK r27d, android28, 4K pages, bylaws
# llvm-mingw 20250920, their termuxfs and prefixPack), with proton-patches/11.0-1/*.patch
# from this repo on top, in name order.
#
# The package keeps versionName 11.0-1-arm64ec (GameNative's identifier regex needs the
# plain "11.0-1-arm64ec" form) and uses versionCode 100 + run number, so it installs next
# to the stock one (proton-11.0-1-arm64ec-1) as proton-11.0-1-arm64ec-<code>; no delete
# step, and every build gets a new entry.
name: Build Proton ARM64EC WCP

on:
  push:
    branches: [ main, d2r/clean, 'claude/**' ]
    paths: [ .github/workflows/build-proton-wcp.yml, proton-patches/** ]
  workflow_dispatch:

env:
  PROTON_REPO: GameNative/proton-wine
  PROTON_REF: f7c016668db739f563e3d4781c27ed085843d63a
  PROTON_VERSION: 11.0-1
  D2R_TAG: d2r1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android
          df -h

      - name: Checkout proton-wine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTON_REPO }}
          ref: ${{ env.PROTON_REF }}

      - name: Checkout our Proton patches
        uses: actions/checkout@v4
        with:
          path: fex-src
          sparse-checkout: proton-patches

      - name: Apply our patches
        run: |
          for p in fex-src/proton-patches/${PROTON_VERSION}/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          git diff --stat
          # keep the patch folder out of the source tree (configure/autogen don't need it)
          mv fex-src "$RUNNER_TEMP/fex-src"

      - name: Version
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$CODE" >> $GITHUB_ENV
          echo "Proton ${PROTON_VERSION} ${D2R_TAG}, versionCode $CODE"

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl unzip flex bison gettext \
            autoconf automake libtool pkg-config mingw-w64 gcc-multilib g++-multilib \
            libfreetype6-dev libfreetype6-dev:i386 libpng-dev libpng-dev:i386 \
            zlib1g-dev zlib1g-dev:i386

      - name: Download termuxfs
        run: |
          mkdir -p $HOME/termuxfs/aarch64
          cd $HOME/termuxfs/aarch64
          wget -q https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen
        run: bash build-scripts/build-step0-autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: proton-wine-tools-${{ env.PROTON_REF }}

      - name: Build wine-tools
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: bash build-scripts/build-step0.sh

      - name: Build sysvshm library
        run: bash build-scripts/build-step-arm64ec.sh --build-sysvshm

      - name: Configure
        run: |
          bash build-scripts/build-step-arm64ec.sh --configure 2>&1 | tee configure-patches.log
          # GameNative's script skips Android patches that don't apply; ours must not shift that
          if grep -E "^(SKIPPED|FAILED)" configure-patches.log; then
            echo "::warning::some GameNative Android patches did not apply (see above)"
          fi

      - name: Build
        run: bash build-scripts/build-step-arm64ec.sh --build

      - name: Install
        run: bash build-scripts/build-step-arm64ec.sh --install

      - name: Check the fix is in ntdll.dll
        run: |
          # the patched wake functions write addr with a release store after list_remove;
          # just make sure the PE ntdll was rebuilt from our tree
          ls -la $HOME/compiled-files-aarch64/lib/wine/*-windows/ntdll.dll
          grep -c "WritePointerRelease( (void \* volatile \*)&entry->addr, NULL )" dlls/ntdll/sync.c

      - name: Package wcp
        run: |
          wget -q https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz
          cd $HOME/compiled-files-aarch64
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cat > profile.json <<EOF
          {
            "type": "Proton",
            "versionName": "${PROTON_VERSION}-arm64ec",
            "versionCode": ${VERSION_CODE},
            "description": "Proton ${PROTON_VERSION} arm64ec ${D2R_TAG} (build ${GITHUB_RUN_NUMBER}): GameNative 11.0-1 + fex-d2-reforged proton-patches",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          cat profile.json
          OUT=proton-${PROTON_VERSION}-arm64ec-${D2R_TAG}-${GITHUB_RUN_NUMBER}.wcp
          tar cJf $GITHUB_WORKSPACE/$OUT bin lib share prefixPack.txz profile.json
          echo "WCP=$OUT" >> $GITHUB_ENV
          ls -la $GITHUB_WORKSPACE/$OUT
          sha256sum $GITHUB_WORKSPACE/$OUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-wcp
          path: ${{ env.WCP }}
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: proton-${{ env.PROTON_VERSION }}-arm64ec-${{ env.D2R_TAG }}-${{ github.run_number }}
          name: Proton ${{ env.PROTON_VERSION }} ARM64EC ${{ env.D2R_TAG }} (build ${{ github.run_number }})
          files: ${{ env.WCP }}
          prerelease: true
          body: |
            Our own Proton for D2R on the AYN Thor: GameNative's Proton 11.0-1 ARM64EC
            (proton-wine proton_11.0 @ ${{ env.PROTON_REF }}, built like their SDK 28 package)
            with this repo's proton-patches/${{ env.PROTON_VERSION }} on top.

            Shows up in GameNative as proton-11.0-1-arm64ec-${{ env.VERSION_CODE }}, next to the
            stock proton-11.0-1-arm64ec-1 (no need to delete anything). Pick it in the container's
            Wine/Proton version setting; switch back to -1 to compare.

            d2r1 patches:
            - 0001 ntdll: a woken WaitOnAddress waiter is taken off the wait list before its
              address is cleared (fix from Valve's wine bleeding-edge / upstream Wine). Before, a
              waiter could return and reuse its stack entry while the waker was still unlinking it,
              corrupting the wait list: every SRW lock, condition variable and WaitOnAddress on that
              list then spun forever (D2R's freezes with main thread in RtlWakeConditionVariable).
