# Build our own Proton 11.0-1 (ARM64EC, bionic) and package it as a GameNative Proton .wcp.
#
# Source: GameNative/proton-wine, branch proton_11.0, pinned to the commit GameNative's
# stock "Proton 11.0-1 ARM64ec" (proton-11.0-1-arm64ec-1, release build-p11-20260502-1-sdk28)
# was built from (plus their workflow-only commit f7c0166). Built the same way as their
# build-proton-sdk28.yml (aarch64 job only: NDK r27d, android28, 4K pages, bylaws
# llvm-mingw 20250920, their termuxfs and prefixPack), with proton-patches/11.0-1/*.patch
# from this repo on top, in name order.
#
# Fast rebuilds without stale code: compiles go through ccache, which keys every object
# on the preprocessed source, the compiler and its flags (content, not timestamps); the
# source tree is checked out fresh every run and no build tree is restored. A patch to
# one file recompiles that file only (~10 min builds instead of ~37). workflow_dispatch
# with full=true (the default there) builds without ccache. Every build then proves each
# patch is in the built binaries (tools/proton/check-patches.sh, a patch without a check
# fails the build) and carries the patch set's hash in its name, profile and
# share/wine/d2r-proton.txt.
#
# The package keeps versionName 11.0-1-arm64ec (GameNative's identifier regex needs the
# plain "11.0-1-arm64ec" form) and uses versionCode 100 + run number, so every build is a
# new entry proton-11.0-1-arm64ec-<code>. GameNative keeps one install per version name
# (seen on the Thor, 2026-11-02), so an import replaces the 11.0-1 installed before and the
# container has to be pointed at the new entry.
name: Build Proton ARM64EC WCP

on:
  push:
    branches: [ main, d2r/clean, 'claude/**' ]
    paths: [ .github/workflows/build-proton-wcp.yml, proton-patches/** ]
  workflow_dispatch:
    inputs:
      full:
        description: Full build without ccache (for batch releases)
        type: boolean
        default: true

env:
  PROTON_REPO: GameNative/proton-wine
  PROTON_REF: f7c016668db739f563e3d4781c27ed085843d63a
  PROTON_VERSION: 11.0-1
  D2R_TAG: d2r7
  # Optimization of the unix side (ntdll.so, wineserver, win32u.so, winevulkan.so, ...).
  # GameNative's build script sets CFLAGS to warning flags only, so configure's default
  # "-g -O2" never applies and their stock packages run the whole unix side unoptimized
  # (-O0); the PE side gets -O2 from configure's CROSSCFLAGS default either way.
  UNIX_OPT: -O2
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 3G

# shell: bash runs every step with -eo pipefail, so a command that fails in front of
# "| tee" fails its step. Without it, check-patches.sh's FAIL lines didn't stop the build
# (d2r5 run 5 shipped with two FAIL 0007 lines from a too narrow check).
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout proton-wine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTON_REPO }}
          ref: ${{ env.PROTON_REF }}

      - name: Checkout our Proton patches
        uses: actions/checkout@v4
        with:
          path: fex-src
          sparse-checkout: |
            proton-patches
            tools/proton

      - name: Apply our patches
        run: |
          for p in fex-src/proton-patches/${PROTON_VERSION}/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          git diff --stat
          # keep the patch folder out of the source tree (configure/autogen don't need it)
          mv fex-src "$RUNNER_TEMP/fex-src"

      - name: Version
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          PATCH_HASH=$(cat $RUNNER_TEMP/fex-src/proton-patches/${PROTON_VERSION}/*.patch | sha256sum | cut -c1-8)
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.full }}" = true ]; then USE_CCACHE=0; else USE_CCACHE=1; fi
          echo "VERSION_CODE=$CODE" >> $GITHUB_ENV
          echo "PATCH_HASH=$PATCH_HASH" >> $GITHUB_ENV
          echo "USE_CCACHE=$USE_CCACHE" >> $GITHUB_ENV
          echo "Proton ${PROTON_VERSION} ${D2R_TAG}, versionCode $CODE, patch set $PATCH_HASH, ccache $USE_CCACHE"

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl unzip flex bison gettext \
            autoconf automake libtool pkg-config mingw-w64 gcc-multilib g++-multilib ccache \
            libfreetype6-dev libfreetype6-dev:i386 libpng-dev libpng-dev:i386 \
            zlib1g-dev zlib1g-dev:i386

      - name: Download termuxfs
        run: |
          mkdir -p $HOME/termuxfs/aarch64
          cd $HOME/termuxfs/aarch64
          wget -q https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen
        run: bash build-scripts/build-step0-autogen.sh

      - name: Build wine-tools
        run: bash build-scripts/build-step0.sh

      - name: Restore ccache
        if: env.USE_CCACHE == '1'
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: proton-ccache-${{ env.PROTON_REF }}-ndk27d-llvmmingw20250920-${{ github.run_id }}
          restore-keys: proton-ccache-${{ env.PROTON_REF }}-ndk27d-llvmmingw20250920-

      - name: Route compilers through ccache
        if: env.USE_CCACHE == '1'
        run: |
          # PE side: configure calls plain "clang" from llvm-mingw; a ccache symlink named clang
          # ahead of it in PATH (ccache then runs the next clang in PATH). Unix side: the NDK clang.
          mkdir -p $HOME/ccache-wrap
          ln -sf "$(command -v ccache)" $HOME/ccache-wrap/clang
          S=build-scripts/build-step-arm64ec.sh
          sed -i 's|^export PATH=\$LLVM_MINGW_TOOLCHAIN:\$PATH$|export PATH=$HOME/ccache-wrap:$LLVM_MINGW_TOOLCHAIN:$PATH|' $S
          sed -i 's|^export CC=\$TOOLCHAIN/\$TARGET-clang$|export CC="ccache $TOOLCHAIN/$TARGET-clang"|' $S
          sed -i 's|^export CXX=\$TOOLCHAIN/\$TARGET-clang++$|export CXX="ccache $TOOLCHAIN/$TARGET-clang++"|' $S
          grep -n 'ccache' $S
          [ "$(grep -c ccache $S)" = 3 ] || { echo "::error::build script changed, ccache not routed"; exit 1; }
          ccache -z

      - name: Optimize the unix side
        run: |
          S=build-scripts/build-step-arm64ec.sh
          sed -i 's|^export C_OPTS="-Wno-declaration-after-statement |export C_OPTS="'"$UNIX_OPT"' -Wno-declaration-after-statement |' $S
          grep -n '^export C_OPTS=' $S
          grep -q "^export C_OPTS=\"$UNIX_OPT -Wno-declaration-after-statement " $S || { echo "::error::build script changed, unix side not optimized"; exit 1; }

      - name: Build sysvshm library
        run: bash build-scripts/build-step-arm64ec.sh --build-sysvshm

      - name: Configure
        run: |
          bash build-scripts/build-step-arm64ec.sh --configure 2>&1 | tee configure-patches.log
          # GameNative's script skips Android patches that don't apply; ours must not shift that
          if grep -E "^(SKIPPED|FAILED)" configure-patches.log; then
            echo "::warning::some GameNative Android patches did not apply (see above)"
          fi

      - name: Build
        run: |
          bash build-scripts/build-step-arm64ec.sh --build 2>&1 | tee $RUNNER_TEMP/build.log
          if [ "$USE_CCACHE" = 1 ]; then
            ccache -s | tee $RUNNER_TEMP/ccache-stats.txt
            HITS=$(ccache --print-stats | awk -F'\t' '$1=="direct_cache_hit"||$1=="preprocessed_cache_hit"{h+=$2} $1=="cache_miss"{m+=$2} END{if(h+m) printf "%d", 100*h/(h+m); else print 0}')
            echo "BUILD_KIND=cached build, ${HITS}% of compiles from ccache" >> $GITHUB_ENV
          else
            echo "BUILD_KIND=full build without ccache" >> $GITHUB_ENV
          fi

      - name: Install
        run: bash build-scripts/build-step-arm64ec.sh --install

      - name: Check every patch is in the built binaries
        run: |
          OBJDUMP=$HOME/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64/bin/llvm-objdump
          [ -x "$OBJDUMP" ] || OBJDUMP=$(command -v llvm-objdump-18 || command -v llvm-objdump)
          echo "objdump: $OBJDUMP"
          # patch 0006's line table: the places the built ntdll.so takes the memory lock (its own
          # list), named from virtual.c as compiled, i.e. after GameNative's Android patches from
          # the Configure step (they move lines; a table made before them was 15 lines off in d2r4)
          bash $RUNNER_TEMP/fex-src/tools/proton/vm-lock-lines.sh dlls/ntdll/unix/virtual.c \
            $HOME/compiled-files-aarch64/lib/wine/aarch64-unix/ntdll.so > $RUNNER_TEMP/vm-lock-lines.txt
          cat $RUNNER_TEMP/vm-lock-lines.txt
          # patch 0008's request name table, from server_protocol.h as compiled (autogen.sh
          # regenerates it after GameNative's protocol.def patch, so numbers differ from git's)
          bash $RUNNER_TEMP/fex-src/tools/proton/server-requests.sh include/wine/server_protocol.h > $RUNNER_TEMP/server-requests.txt
          wc -l $RUNNER_TEMP/server-requests.txt
          REQ_NAMES=$RUNNER_TEMP/server-requests.txt \
          VM_LINES=$RUNNER_TEMP/vm-lock-lines.txt VM_SOURCE=dlls/ntdll/unix/virtual.c \
          OBJDUMP=$OBJDUMP bash $RUNNER_TEMP/fex-src/tools/proton/check-patches.sh $HOME/compiled-files-aarch64 \
            $RUNNER_TEMP/fex-src/proton-patches/${PROTON_VERSION} | tee $RUNNER_TEMP/checks.txt
          # the unix side really is optimized (UNIX_OPT): no binary keeps out-of-line copies of
          # the tiny header helpers an unoptimized build emits in every object
          NM=$(command -v llvm-nm-18 || command -v llvm-nm) \
          bash $RUNNER_TEMP/fex-src/tools/proton/check-unix-opt.sh $HOME/compiled-files-aarch64 | tee -a $RUNNER_TEMP/checks.txt
          # compiler warnings that point at undefined behaviour an optimizer can turn into wrong
          # code (information, shipped as share/wine/d2r-build-warnings.txt)
          bash $RUNNER_TEMP/fex-src/tools/proton/compile-warnings.sh $RUNNER_TEMP/build.log > $RUNNER_TEMP/build-warnings.txt
          cat $RUNNER_TEMP/build-warnings.txt

      - name: Package wcp
        run: |
          wget -q https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz
          cd $HOME/compiled-files-aarch64
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          {
            echo "Proton ${PROTON_VERSION} arm64ec ${D2R_TAG} build ${GITHUB_RUN_NUMBER} (versionCode ${VERSION_CODE})"
            echo "source ${PROTON_REPO} @ ${PROTON_REF}"
            echo "patch set ${PATCH_HASH}: $(cd $RUNNER_TEMP/fex-src/proton-patches/${PROTON_VERSION} && ls *.patch | tr '\n' ' ')"
            echo "fex-d2-reforged ${GITHUB_SHA}, ${BUILD_KIND}"
            echo "unix side built with ${UNIX_OPT} (GameNative's script: no optimization)"
            echo "binary checks:"; cat $RUNNER_TEMP/checks.txt
          } > share/wine/d2r-proton.txt
          cp $RUNNER_TEMP/vm-lock-lines.txt share/wine/d2r-vm-lock-lines.txt
          cp $RUNNER_TEMP/server-requests.txt share/wine/d2r-server-requests.txt
          cp $RUNNER_TEMP/build-warnings.txt share/wine/d2r-build-warnings.txt
          cat share/wine/d2r-proton.txt
          cat > profile.json <<EOF
          {
            "type": "Proton",
            "versionName": "${PROTON_VERSION}-arm64ec",
            "versionCode": ${VERSION_CODE},
            "description": "Proton ${PROTON_VERSION} arm64ec ${D2R_TAG} (build ${GITHUB_RUN_NUMBER}, patch set ${PATCH_HASH}, unix ${UNIX_OPT}): GameNative 11.0-1 + fex-d2-reforged proton-patches",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          cat profile.json
          OUT=proton-${PROTON_VERSION}-arm64ec-${D2R_TAG}-${GITHUB_RUN_NUMBER}.wcp
          # same .xz format as GameNative's packages, multi-threaded
          tar -I 'xz -T0 -6' -cf $GITHUB_WORKSPACE/$OUT bin lib share prefixPack.txz profile.json
          echo "WCP=$OUT" >> $GITHUB_ENV
          ls -la $GITHUB_WORKSPACE/$OUT
          sha256sum $GITHUB_WORKSPACE/$OUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-wcp
          path: ${{ env.WCP }}
          retention-days: 30

      - name: Release notes
        run: |
          {
            echo "Our own Proton for D2R on the AYN Thor: GameNative's Proton ${PROTON_VERSION} ARM64EC"
            echo "(${PROTON_REPO} proton_11.0 @ ${PROTON_REF}, built like their SDK 28 package)"
            echo "with this repo's proton-patches/${PROTON_VERSION} on top. Patch set **${PATCH_HASH}**, ${BUILD_KIND}."
            echo "Unix side (ntdll.so, wineserver, win32u.so, winevulkan.so, ...) built with **${UNIX_OPT}**;"
            echo "GameNative's build script leaves it unoptimized (CFLAGS without -O), their stock package too."
            echo
            echo "Shows up in GameNative as **proton-${PROTON_VERSION}-arm64ec-${VERSION_CODE}**. GameNative keeps one"
            echo "Proton per version name, so importing it replaces the Proton 11.0-1 installed before (stock or an"
            echo "earlier build of ours). After the import, pick the new entry in the container's Proton setting,"
            echo "otherwise the container still names the replaced one and the start fails (\"No base prefix\")."
            echo "Back to stock: download Proton 11.0-1 again in GameNative (that replaces this one)."
            echo
            echo "Patches (first line of each; full text in proton-patches/${PROTON_VERSION}):"
            for p in $RUNNER_TEMP/fex-src/proton-patches/${PROTON_VERSION}/*.patch; do
              echo "- $(basename $p .patch | cut -c1-4): $(head -1 $p)"
            done
            echo
            echo "Off switches (container environment variables):"
            echo "- WINE_D2R_WAIT_LOCK=0: wait list locks spin as in stock Wine (0002)"
            echo "- WINE_D2R_XINPUT=0: xinput reads and rumble as in stock Wine (0003)"
            echo "- WINE_D2R_WAKE_FAST=0: every wake takes the wait list lock as in stock Wine (0004)"
            echo "- WINE_D2R_VM_IO=0: pipe, device and socket I/O under the memory lock as in stock Wine (0005)"
            echo "- WINE_D2R_VM_NOTES=0: the memory lock keeps no holder notes (0006)"
            echo "- WINE_D2R_FAST_CONTINUE=0: NtContinue to x64 code takes the syscall as in stock Wine (0007)"
            echo "- WINE_D2R_EVENT_REUSE=0: anonymous events are closed as in stock Wine (0008)"
            echo "- WINE_D2R_CALL_COUNTS=0: no wineserver request counters (0008)"
            echo
            echo "Compiler warnings that point at undefined behaviour (list in share/wine/d2r-build-warnings.txt):"
            echo '```'
            sed -n '/^-- /,$p' $RUNNER_TEMP/build-warnings.txt
            echo '```'
            echo
            echo "Binary checks of this build:"
            echo '```'
            cat $RUNNER_TEMP/checks.txt
            echo '```'
          } > $RUNNER_TEMP/notes.md
          cat $RUNNER_TEMP/notes.md

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: proton-${{ env.PROTON_VERSION }}-arm64ec-${{ env.D2R_TAG }}-${{ github.run_number }}
          name: Proton ${{ env.PROTON_VERSION }} ARM64EC ${{ env.D2R_TAG }} (build ${{ github.run_number }}, patch set ${{ env.PATCH_HASH }})
          files: ${{ env.WCP }}
          prerelease: true
          body_path: ${{ runner.temp }}/notes.md
