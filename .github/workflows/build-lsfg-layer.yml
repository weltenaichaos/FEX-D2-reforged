name: Build LSFG layer (D2R debug)

on:
  workflow_dispatch:
  push:
    branches: [d2r/clean]
    paths:
      - tools/lsfg/**
      - .github/workflows/build-lsfg-layer.yml

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: 27.3.13750724
  ANDROID_PLATFORM: android-28
  LSFG_COMMIT: abc77c8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fex

      - name: Checkout lsfg-vk-android
        run: |
          git clone https://github.com/GameNative/lsfg-vk-android.git lsfg
          cd lsfg
          git checkout "$LSFG_COMMIT"
          git submodule update --init --recursive
          git apply --verbose ../fex/tools/lsfg/d2r-debug.patch

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build arm64-v8a
        working-directory: lsfg
        env:
          ANDROID_ABI: arm64-v8a
          HOST_TAG: linux-x86_64
        run: bash ./scripts/build/android.sh Release

      - name: Package
        run: |
          mkdir out
          cp lsfg/build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so out/liblsfg-vk-layer.so
          file out/liblsfg-vk-layer.so
          strings out/liblsfg-vk-layer.so | grep -c "\[dbg\]"

      - uses: actions/upload-artifact@v4
        with:
          name: liblsfg-vk-layer
          path: out/liblsfg-vk-layer.so

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lsfg-d2r-debug-${{ github.run_number }}"
          gh release create "$TAG" out/liblsfg-vk-layer.so \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "$TAG" --prerelease \
            --notes "GameNative lsfg-vk layer ($LSFG_COMMIT) with D2R swapchain fix attempt and debug logging. Replace Z:\\home\\xuser-STEAM_2536520\\.local\\lib\\liblsfg-vk-layer.so with this file."
