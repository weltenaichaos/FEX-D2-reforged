name: Build LSFG layer (D2R)

on:
  workflow_dispatch:
  push:
    branches: [d2r/clean]
    paths:
      - tools/lsfg/**
      - .github/workflows/build-lsfg-layer.yml

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: 27.3.13750724
  ANDROID_PLATFORM: android-28
  LSFG_COMMIT: abc77c8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fex

      - name: Checkout lsfg-vk-android
        run: |
          git clone https://github.com/GameNative/lsfg-vk-android.git lsfg
          cd lsfg
          git checkout "$LSFG_COMMIT"
          git submodule update --init --recursive
          git apply --verbose ../fex/tools/lsfg/d2r.patch

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build arm64-v8a
        working-directory: lsfg
        env:
          ANDROID_ABI: arm64-v8a
          HOST_TAG: linux-x86_64
        run: bash ./scripts/build/android.sh Release

      - name: Package
        run: |
          mkdir out
          cp lsfg/build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so out/liblsfg-vk-layer.so
          file out/liblsfg-vk-layer.so
          strings out/liblsfg-vk-layer.so | grep -c "\[dbg\]"
          # D2R layer 7: the real frame's present thread
          strings out/liblsfg-vk-layer.so | grep -c "lsfg-present"
          strings out/liblsfg-vk-layer.so | grep -c "LSFG_D2R_DEFER"
          strings out/liblsfg-vk-layer.so | grep -c "LSFG_D2R_EARLY"
          strings out/liblsfg-vk-layer.so | grep -c "LSFG_D2R_PRESENT_EARLY_US"
          strings out/liblsfg-vk-layer.so | grep -c "d2r-9"

      - uses: actions/upload-artifact@v4
        with:
          name: liblsfg-vk-layer
          path: out/liblsfg-vk-layer.so

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lsfg-d2r-${{ github.run_number }}"
          gh release create "$TAG" out/liblsfg-vk-layer.so \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "$TAG" --prerelease \
            --notes "GameNative lsfg-vk layer ($LSFG_COMMIT) with the D2R fixes (instance tracking, queue lock, pacer; layer 7: a frame's presents go out from the layer's own present thread instead of inside the game's vkQueuePresentKHR, and a generated frame only once the GPU drew it; LSFG_D2R_DEFER=0 / LSFG_D2R_GEN_DRAWN=0 turn them off; stats.txt gets call_ms, defer_* and gen_drawn_* fields; layer 8: a frame's copy and frame generation start at the game's submit that blits it into its swapchain image, ahead of the game's next frame on the GPU, with one swapchain image more; LSFG_D2R_EARLY=0 turns it off; stats.txt gets early_* fields; layer 9: the present thread's sleep ends 1 ms before a present's slot and it waits the rest on the CPU, so a late wake-up doesn't make the frame late (LSFG_D2R_PRESENT_EARLY_US, 0 = sleep until the slot), and GPU times of the copy and frame generation without LSFG_DEBUG (LSFG_D2R_GPU_TIMES=0 turns them off); stats.txt gets the latest present after its slot, late counts, the present thread's CPUs and gpu_* fields). Set LSFG_DEBUG=1 for diagnostic logging. Replace Z:\\home\\xuser-STEAM_2536520\\.local\\lib\\liblsfg-vk-layer.so with this file."
