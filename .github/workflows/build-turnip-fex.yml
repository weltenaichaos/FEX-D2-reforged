# Build FEX's Turnip (Mesa freedreno Vulkan) driver for Android/KGSL and package it as an
# adrenotools driver zip (libvulkan_freedreno.so + meta.json) that GameNative imports as a
# GPU driver.
#
# Mesa tag MESA_TAG plus this repo's turnip-patches/*.patch, in name order. The patches add
# the FEX link (TU_FEX_CHANNEL, see Source/Windows/Common/TurnipChannel.h): a descriptor
# cache fix FEX turns on and off each second, GPU counters around big render passes for
# FEX's stats log, (fex2) early preambles for loads through push descriptor sets, (fex3)
# start-of-pass depth clears as 3D draws in direct passes, (fex4) those draws without
# fragment shader (fast Z), (fex5) a memory budget query that reads /proc/meminfo at most
# every 250 ms and (fex6) shader preambles that issue their memory loads first and store each
# value once. Without FEX's link the driver behaves like stock Turnip.
#
# Recipe after The412Banner/banners-turnip build_turnip.sh (NDK r29, KGSL only).
name: Build Turnip (FEX)

on:
  push:
    branches: [ d2r/clean, 'claude/**' ]
    paths: [ .github/workflows/build-turnip-fex.yml, turnip-patches/** ]
  workflow_dispatch:

env:
  MESA_TAG: mesa-26.3.0-rc2
  MESA_COMMIT: b34c71d9ff2f6514a1f947609d00e49be639edf8
  FEX_PATCH: fex6
  NDK: android-ndk-r29
  SDK: "34"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout FEX patches
        uses: actions/checkout@v4
        with:
          path: fex-src
          sparse-checkout: turnip-patches

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build flex bison glslang-tools zip unzip python3-pip pkg-config
          pip install --user --break-system-packages meson mako pyyaml || pip install --user meson mako pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch Mesa
        run: |
          git clone --depth 1 --branch "$MESA_TAG" https://gitlab.freedesktop.org/mesa/mesa.git mesa \
            || git clone --depth 1 --branch "$MESA_TAG" https://github.com/chaotic-cx/mesa-mirror.git mesa
          cd mesa
          test "$(git rev-parse HEAD)" = "$MESA_COMMIT"
          cat VERSION

      - name: Apply FEX patches
        working-directory: mesa
        run: |
          for p in ../fex-src/turnip-patches/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          git diff --stat

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK }}
          key: ${{ env.NDK }}-linux

      - name: Download Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://dl.google.com/android/repository/${NDK}-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          rm ndk.zip

      - name: Build
        working-directory: mesa
        run: |
          set -e
          ndk="$GITHUB_WORKSPACE/$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CFLAGS="-D__ANDROID__ -Wno-error -Wno-deprecated-declarations -Wno-incompatible-pointer-types-discards-qualifiers -Wno-incompatible-pointer-types"
          export CXXFLAGS="$CFLAGS"
          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$ndk/llvm-ar'
          c = ['$ndk/aarch64-linux-android$SDK-clang']
          cpp = ['$ndk/aarch64-linux-android$SDK-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '$ndk/ld.lld'
          cpp_ld = '$ndk/ld.lld'
          strip = '$ndk/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=$ndk/pkg-config', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          sed -i 's/^          //' android-aarch64.txt
          cat android-aarch64.txt
          CC=gcc CXX=g++ meson setup build-android \
            --cross-file android-aarch64.txt \
            --prefix "$GITHUB_WORKSPACE/turnip-out" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dvideo-codecs= \
            -Dplatform-sdk-version=36 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dandroid-libbacktrace=disabled
          ninja -C build-android install

      - name: Verify
        run: |
          so="$GITHUB_WORKSPACE/turnip-out/lib/libvulkan_freedreno.so"
          ls -la "$so"
          file "$so"
          strings "$so" | grep -q TU_FEX_CHANNEL
          strings "$so" | grep -E "^Mesa .* fex%d$|fex pass ring" | head
          strings "$so" | grep -q "fex pass ring"
          grep -q "TU_FEX_COMPILE_PUSH_SPECULATE" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_descriptor_set.cc"
          grep -q "tu_fex_clear_depth_3d" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_cmd_buffer.cc"
          grep -q "define TU_FEX_PATCH 6" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_fex.h"
          grep -q "fex_preamble_loads_first" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_postsched.c"
          grep -q "ir3_nir_fex_dedupe_preamble_stores" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_nir.c"
          grep -q "tu_fex_available_memory" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_device.cc"
          grep -q "clear_fs_disable" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_clear_blit.cc"

      - name: Package adrenotools zip
        run: |
          cd "$GITHUB_WORKSPACE/turnip-out/lib"
          MESA_VERSION=$(cat "$GITHUB_WORKSPACE/mesa/VERSION" | tr -d '[:space:]')
          cat > meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "Turnip ${MESA_VERSION} FEX ${FEX_PATCH} (build ${{ github.run_number }})",
            "description": "Mesa ${MESA_VERSION} Turnip (KGSL) with FEX-D2-reforged turnip-patches: descriptor cache fix, GPU counters, early preambles for push descriptor sets, preamble loads first, 3D (fast Z) depth clears and a cached memory budget via FEX's link (TU_FEX_CHANNEL). Behaves like stock Turnip without FEX's link.",
            "author": "FEX-D2-reforged",
            "packageVersion": "${{ github.run_number }}",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.4",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF
          sed -i 's/^          //' meta.json
          cat meta.json
          python3 -c "import json; json.load(open('meta.json'))"
          zip -q "$GITHUB_WORKSPACE/turnip-${MESA_VERSION}-${FEX_PATCH}.zip" libvulkan_freedreno.so meta.json
          echo "ZIPNAME=turnip-${MESA_VERSION}-${FEX_PATCH}.zip" >> "$GITHUB_ENV"
          echo "MESA_VERSION=${MESA_VERSION}" >> "$GITHUB_ENV"
          unzip -l "$GITHUB_WORKSPACE/turnip-${MESA_VERSION}-${FEX_PATCH}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-fex
          path: ${{ env.ZIPNAME }}
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: turnip-${{ env.MESA_VERSION }}-${{ env.FEX_PATCH }}-${{ github.run_number }}
          name: Turnip ${{ env.MESA_VERSION }} FEX ${{ env.FEX_PATCH }} (build ${{ github.run_number }})
          files: ${{ env.ZIPNAME }}
          prerelease: true
          body: |
            Mesa ${{ env.MESA_TAG }} Turnip Vulkan driver for Adreno (Android, KGSL), with this repo's
            turnip-patches. Import in GameNative as a GPU driver (adrenotools zip).
            fex1: with FEX's link (FEX build 69 and later, TU_FEX_CHANNEL), descriptor updates in direct
            render passes invalidate only the descriptor sets whose address changed instead of all 8, and
            an identical push descriptor update keeps its old copy (FEX turns this on in every other
            second); the GPU counts shader core, instruction cache, descriptor cache and texture events
            around render passes with 100+ draws for FEX's stats log.
            fex2 (FEX build 71 and later, FEX_TU_EARLY_PREAMBLE=1): push descriptor sets made for descriptor
            buffers count as written (bindings not pushed since a layout change are zeroed), so shader
            reads of vkd3d's root constant buffers can run in the early preamble, ahead of the draw's
            pixel waves.
            fex3 (FEX build 72 and later, FEX_TU_DEPTH_CLEAR=alt|1): a depth/stencil attachment cleared at
            the start of a direct (sysmem) render pass is cleared by one 3D draw through the depth unit
            after the pass state is set up (like vkCmdClearAttachments inside a pass) instead of by the 2D
            engine; FEX can switch it each second and the driver counts both kinds.
            fex4 (FEX build 74 and later, FEX_TU_DEPTH_CLEAR=alt|fastz): that 3D clear draw can run with the
            fragment shader disabled (fast Z, as Turnip does for depth-only pipelines), so its pixels don't
            go through the shader cores.
            fex5 (FEX build 77 and later, FEX_TU_BUDGET_CACHE=1): the memory budget query
            (vkGetPhysicalDeviceMemoryProperties2 with VK_EXT_memory_budget, which DXGI's
            QueryVideoMemoryInfo asks every frame) reads /proc/meminfo at most every 250 ms instead of on
            every call; the driver counts the queries, the file reads and their time for FEX's stats log.
            fex6 (FEX build 92 and later, FEX_TU_PREAMBLE_LOADS=1): shader preambles issue their memory loads
            first and the constant buffer copies (ldc.k) right after them, so their waits overlap, and store
            each value once (D2R's lighting shaders: 5 waits -> 2, 243-253 -> 174-184 preamble instructions).
            Without FEX's link it behaves like stock Turnip.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
