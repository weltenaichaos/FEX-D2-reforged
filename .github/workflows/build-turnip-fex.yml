# Build FEX's Turnip (Mesa freedreno Vulkan) driver for Android/KGSL and package it as an
# adrenotools driver zip (libvulkan_freedreno.so + meta.json) that GameNative imports as a
# GPU driver.
#
# Mesa tag MESA_TAG plus this repo's turnip-patches/*.patch, in name order. The patches add
# the FEX link (TU_FEX_CHANNEL, see Source/Windows/Common/TurnipChannel.h): a descriptor
# cache fix FEX turns on and off each second, GPU counters around big render passes for
# FEX's stats log, (fex2) early preambles for loads through push descriptor sets, (fex3)
# start-of-pass depth clears as 3D draws in direct passes, (fex4) those draws without
# fragment shader (fast Z), (fex5) a memory budget query that reads /proc/meminfo at most
# every 250 ms, (fex6) shader preambles that issue their memory loads first and store each
# value once, (fex7) fragment shader list loops that read the next entry one iteration
# ahead, (fex8) start-of-pass color clears as 3D draws too, plus compute loops unrolled
# further when their loads can overlap, (fex9) push descriptor set UBO ranges loaded
# into shader constants by the command processor, without a descriptor set change per
# draw, (fex10) the remaining push set UBO reads (indexed arrays such as bone
# matrices) through the shader's own UBO table, so those draws skip the change too,
# (fex11) graphics pipeline switches that send only the state that changed, (fex12)
# a second binary of big fragment shaders without alias.tex helpers, picked per second,
# and (fex13) that second binary without preamble instead, with its own constant layout.
# Without FEX's link the driver behaves like stock Turnip.
#
# Recipe after The412Banner/banners-turnip build_turnip.sh (NDK r29, KGSL only).
name: Build Turnip (FEX)

on:
  push:
    branches: [ d2r/clean, 'claude/**' ]
    paths: [ .github/workflows/build-turnip-fex.yml, turnip-patches/** ]
  workflow_dispatch:

env:
  MESA_TAG: mesa-26.3.0-rc2
  MESA_COMMIT: b34c71d9ff2f6514a1f947609d00e49be639edf8
  FEX_PATCH: fex13
  NDK: android-ndk-r29
  SDK: "34"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout FEX patches
        uses: actions/checkout@v4
        with:
          path: fex-src
          sparse-checkout: turnip-patches

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build flex bison glslang-tools zip unzip python3-pip pkg-config
          pip install --user --break-system-packages meson mako pyyaml || pip install --user meson mako pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch Mesa
        run: |
          git clone --depth 1 --branch "$MESA_TAG" https://gitlab.freedesktop.org/mesa/mesa.git mesa \
            || git clone --depth 1 --branch "$MESA_TAG" https://github.com/chaotic-cx/mesa-mirror.git mesa
          cd mesa
          test "$(git rev-parse HEAD)" = "$MESA_COMMIT"
          cat VERSION

      - name: Apply FEX patches
        working-directory: mesa
        run: |
          for p in ../fex-src/turnip-patches/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          git diff --stat

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK }}
          key: ${{ env.NDK }}-linux

      - name: Download Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://dl.google.com/android/repository/${NDK}-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          rm ndk.zip

      - name: Build
        working-directory: mesa
        run: |
          set -e
          ndk="$GITHUB_WORKSPACE/$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CFLAGS="-D__ANDROID__ -Wno-error -Wno-deprecated-declarations -Wno-incompatible-pointer-types-discards-qualifiers -Wno-incompatible-pointer-types"
          export CXXFLAGS="$CFLAGS"
          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$ndk/llvm-ar'
          c = ['$ndk/aarch64-linux-android$SDK-clang']
          cpp = ['$ndk/aarch64-linux-android$SDK-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '$ndk/ld.lld'
          cpp_ld = '$ndk/ld.lld'
          strip = '$ndk/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=$ndk/pkg-config', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          sed -i 's/^          //' android-aarch64.txt
          cat android-aarch64.txt
          CC=gcc CXX=g++ meson setup build-android \
            --cross-file android-aarch64.txt \
            --prefix "$GITHUB_WORKSPACE/turnip-out" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dvideo-codecs= \
            -Dplatform-sdk-version=36 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dandroid-libbacktrace=disabled
          ninja -C build-android install

      - name: Verify
        run: |
          so="$GITHUB_WORKSPACE/turnip-out/lib/libvulkan_freedreno.so"
          ls -la "$so"
          file "$so"
          strings "$so" | grep -q TU_FEX_CHANNEL
          strings "$so" | grep -E "^Mesa .* fex%d$|fex pass ring" | head
          strings "$so" | grep -q "fex pass ring"
          grep -q "TU_FEX_COMPILE_PUSH_SPECULATE" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_descriptor_set.cc"
          grep -q "tu_fex_clear_3d" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_cmd_buffer.cc"
          grep -q "tu_fex_color_clear_3d_index" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_cmd_buffer.cc"
          grep -q "define TU_FEX_PATCH 13" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_fex.h"
          grep -q "fex_nopreamble" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_nir.c"
          grep -q "TU_FEX_COMPILE_NOPREAMBLE_ALT" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_fex.cc"
          grep -q "fex_alt_fs_variant" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_cmd_buffer.cc"
          grep -q "TU_FEX_MODE_NOALIAS" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_fex.h"
          grep -q "fex_noalias_tex" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_alias.c"
          grep -q "fex_alt_fs_state" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_cmd_buffer.cc"
          grep -q "tu_fex_count_noalias_pipeline" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_pipeline.cc"
          grep -q "TU_FEX_MODE_SWITCH" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_fex.h"
          grep -q "tu_fex_sw_bind" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_cmd_buffer.cc"
          grep -q "fex_common_config" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_pipeline.cc"
          grep -q "ir3_nir_fex_ubo_table" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_nir.c"
          grep -q "TU_FEX_COMPILE_UBO_TABLE" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_fex.cc"
          grep -q "tu_fex_emit_cp_ubos" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_cmd_buffer.cc"
          grep -q "tu_fex_desc_sets_skip" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_cmd_buffer.cc"
          grep -q "fex_cp_ubo_sets" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_nir_analyze_ubo_ranges.c"
          grep -q "fex_cs_nir_options" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_nir.c"
          strings "$so" | grep -q TU_FEX_COLOR_CLEAR
          strings "$so" | grep -q TU_FEX_CS_UNROLL
          grep -q "ir3_nir_fex_loop_prefetch" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_nir.c"
          grep -q "tu_fex_count_loop_prefetch" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_shader.cc"
          grep -q "fex_preamble_loads_first" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_postsched.c"
          grep -q "ir3_nir_fex_dedupe_preamble_stores" "$GITHUB_WORKSPACE/mesa/src/freedreno/ir3/ir3_nir.c"
          grep -q "tu_fex_available_memory" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_device.cc"
          grep -q "clear_fs_disable" "$GITHUB_WORKSPACE/mesa/src/freedreno/vulkan/tu_clear_blit.cc"

      - name: Package adrenotools zip
        run: |
          cd "$GITHUB_WORKSPACE/turnip-out/lib"
          MESA_VERSION=$(cat "$GITHUB_WORKSPACE/mesa/VERSION" | tr -d '[:space:]')
          cat > meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "Turnip ${MESA_VERSION} FEX ${FEX_PATCH} (build ${{ github.run_number }})",
            "description": "Mesa ${MESA_VERSION} Turnip (KGSL) with FEX-D2-reforged turnip-patches: descriptor cache fix, GPU counters, early preambles for push descriptor sets, preamble loads first, list loops read ahead, 3D depth and color clears, compute loops unrolled further, root constant buffers loaded by the command processor or read through the shader's UBO table and a cached memory budget via FEX's link (TU_FEX_CHANNEL). Behaves like stock Turnip without FEX's link.",
            "author": "FEX-D2-reforged",
            "packageVersion": "${{ github.run_number }}",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.4",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF
          sed -i 's/^          //' meta.json
          cat meta.json
          python3 -c "import json; json.load(open('meta.json'))"
          zip -q "$GITHUB_WORKSPACE/turnip-${MESA_VERSION}-${FEX_PATCH}.zip" libvulkan_freedreno.so meta.json
          echo "ZIPNAME=turnip-${MESA_VERSION}-${FEX_PATCH}.zip" >> "$GITHUB_ENV"
          echo "MESA_VERSION=${MESA_VERSION}" >> "$GITHUB_ENV"
          unzip -l "$GITHUB_WORKSPACE/turnip-${MESA_VERSION}-${FEX_PATCH}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-fex
          path: ${{ env.ZIPNAME }}
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: turnip-${{ env.MESA_VERSION }}-${{ env.FEX_PATCH }}-${{ github.run_number }}
          name: Turnip ${{ env.MESA_VERSION }} FEX ${{ env.FEX_PATCH }} (build ${{ github.run_number }})
          files: ${{ env.ZIPNAME }}
          prerelease: true
          body: |
            Mesa ${{ env.MESA_TAG }} Turnip Vulkan driver for Adreno (Android, KGSL), with this repo's
            turnip-patches. Import in GameNative as a GPU driver (adrenotools zip).
            fex1: with FEX's link (FEX build 69 and later, TU_FEX_CHANNEL), descriptor updates in direct
            render passes invalidate only the descriptor sets whose address changed instead of all 8, and
            an identical push descriptor update keeps its old copy (FEX turns this on in every other
            second); the GPU counts shader core, instruction cache, descriptor cache and texture events
            around render passes with 100+ draws for FEX's stats log.
            fex2 (FEX build 71 and later, FEX_TU_EARLY_PREAMBLE=1): push descriptor sets made for descriptor
            buffers count as written (bindings not pushed since a layout change are zeroed), so shader
            reads of vkd3d's root constant buffers can run in the early preamble, ahead of the draw's
            pixel waves.
            fex3 (FEX build 72 and later, FEX_TU_DEPTH_CLEAR=alt|1): a depth/stencil attachment cleared at
            the start of a direct (sysmem) render pass is cleared by one 3D draw through the depth unit
            after the pass state is set up (like vkCmdClearAttachments inside a pass) instead of by the 2D
            engine; FEX can switch it each second and the driver counts both kinds.
            fex4 (FEX build 74 and later, FEX_TU_DEPTH_CLEAR=alt|fastz): that 3D clear draw can run with the
            fragment shader disabled (fast Z, as Turnip does for depth-only pipelines), so its pixels don't
            go through the shader cores.
            fex5 (FEX build 77 and later, FEX_TU_BUDGET_CACHE=1): the memory budget query
            (vkGetPhysicalDeviceMemoryProperties2 with VK_EXT_memory_budget, which DXGI's
            QueryVideoMemoryInfo asks every frame) reads /proc/meminfo at most every 250 ms instead of on
            every call; the driver counts the queries, the file reads and their time for FEX's stats log.
            fex6 (FEX build 92 and later, FEX_TU_PREAMBLE_LOADS=1): shader preambles issue their memory loads
            first and the constant buffer copies (ldc.k) right after them, so their waits overlap, and store
            each value once (D2R's lighting shaders: 5 waits -> 2, 243-253 -> 174-184 preamble instructions).
            fex7 (FEX build 96 and later, FEX_TU_LOOP_PREFETCH=1): fragment shader loops that walk a list
            (entry = list[i], then data at entry) read the next entry while the current one is worked on, so
            the data reads and the next entry's read share one memory wait (D2R's lighting shaders: 4 light
            and decal list loops each, same registers and waves); the driver counts the reads moved.
            fex8 (any FEX build with the link, FEX_TU_DEPTH_CLEAR=1, the default): color attachments cleared
            at the start of a direct (sysmem) render pass join the 3D clear draw (one draw for all of a
            pass's clears) instead of a 2D engine fill each followed by a cache flush and a wait for idle
            (D2R: ~14 color clears a frame); FEX_TU_DEPTH_CLEAR=2 now compares color clears both ways a
            second each (the fast Z bit means "color on the 2D engine"; fast Z gave nothing in build 74),
            and FEX's "fast z" clear counts are the color clears done by a 3D draw. Unix env
            TU_FEX_COLOR_CLEAR=0 turns it off. Compute shader loops with a known trip count whose loads
            depend on the iteration are unrolled up to 128 iterations (stock 32), so the loads go out
            together (D2R's 66a6aa1d0c34c002: 512 serial buffer reads per thread, 0.23 ms a frame);
            TU_FEX_CS_UNROLL=0 turns it off. Status bits 0x2000 / 0x4000 show both.
            fex9 (FEX build 98 and later, FEX_TU_CP_UBO=1, the default; a7xx like the a740): the ranges of
            push descriptor set UBOs that graphics shaders read (vkd3d's D3D12 root constant buffers) are
            loaded into the shader's constants by the command processor before each draw, from the address
            in the pushed descriptor, instead of by the shader's preamble through the descriptor. A draw
            whose shaders then no longer read the push set through descriptors keeps the previous
            descriptor set state when only the push set changed: no new bindless base and no descriptor
            cache invalidation for each draw (D2R pushes new root constant buffers for nearly every draw;
            VKD3D fex29's VKD3D_FEX_CBV_SIZE=1 lets its lighting shaders reach that). Barriers before
            graphics uniform reads also wait for the command processor read. Status bit 0x8000.
            fex10 (FEX build 99 and later, FEX_TU_UBO_TABLE=1, the default; needs fex9 on): push set UBOs
            that graphics shaders still read as UBOs (no known range: indexed arrays such as D2R's
            skinning bone matrices, cb2 with 1536 vectors) are read through the shader's own UBO table
            instead of the push set's descriptor; the driver writes each table entry from the pushed
            descriptor before each draw (CP_LOAD_STATE6 ST6_UBO, 2 dwords). Those shaders then no longer
            read the push set through descriptors, so their draws keep the descriptor set state too
            (D2R: 76% of shadow pass draws use a skinning vertex shader; with fex9 alone they still
            changed it for every draw and paid the constant loads on top). Status bit 0x10000.
            fex11 (FEX build 100 and later, FEX_TU_SWITCH=alt|1; a7xx): at a graphics pipeline switch,
            stock Turnip makes the command processor run ~16 draw state blocks again: each pipeline has
            its own copy of its fixed-function state (a copy with the same bytes still has a new address),
            the empty tessellation/geometry stages are marked dirty, and the program config resets every
            shader stage, so an unchanged vertex shader or the shared empty fragment shader of depth-only
            pipelines is sent again too. With FEX's switch bit, a block made only of register writes whose
            bytes equal the block the GPU ran at the last draw keeps that block's address (skipped), and
            for pipelines without tessellation/geometry shaders only the vertex/fragment stage whose
            shader changed is reset (SP_UPDATE_CNTL) and sent again with its config registers. Host
            check: the register state at every draw is the same as stock's; blocks run per switch 16 ->
            ~4 (depth-only switches -69% state words). The driver counts binds, blocks run/kept and stage
            resets/kept for FEX's log. Status bits 0x20000 (honored) and 0x40000 (counts written).
            fex12 (FEX build 101 and later, FEX_TU_NOALIAS=alt|1; a7xx): fragment shaders with 1,024+
            instructions and 64+ alias.tex helpers (D2R's lighting shaders: ~17% of their instructions)
            are compiled a second time without alias.tex, which moves texture coordinates next to each
            other with movs instead (11-12% fewer instructions, 32 instead of 24 registers). The second
            binary is kept only when the pipeline state built from the shader is the same, and pipelines
            then use it in command buffers begun with FEX's mode bit (FEX switches it each second, so the
            log compares both binaries in one run). Host check: draws differ only in the pixel shader's
            address, size, register footprint and output register. One-time cost: the big shaders are
            compiled twice (new shader cache keys). Status bits 0x80000 (honored) and 0x100000 (counts
            written).
            fex13 (FEX build 104 and later, FEX_TU_NOPREAMBLE=alt|lit; a7xx without consts via preamble,
            e.g. a740): the second binary of big fragment shaders (1,024+ instructions, preamble of 32+
            instructions) is compiled without preamble instead: the values the a7xx early preamble
            computes once per draw before the draw's waves may start are computed by each wave. Build 103
            measured D2R's lighting waves spending 25-30% of their life in the HWAVE_WAIT state, which no
            other pass shows; their preamble is 137 instructions (about 70 one-value constant stores).
            Without it: 6 preamble instructions left (push constant copy), +0.7% instructions, same
            24 registers. That binary has its own constant layout, so a bind with FEX's mode bit also
            loads the fragment stage constants where it reads them. Host check: the root constant buffer
            ranges and immediates load to the second binary's offsets from the same addresses; registers
            differ only in the pixel shader's address, size and output register. Status bit 0x200000;
            the channel extension (0x360) adds both binaries' preamble totals.
            Without FEX's link it behaves like stock Turnip.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
